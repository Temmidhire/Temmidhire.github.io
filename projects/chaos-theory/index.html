<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chaos Theory Feature Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Chart.js core -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-boxplot@4.2.0"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
    h1 { text-align: center; color: #222; }
    .chart-container { width: 85%; margin: 40px auto; }
    table { border-collapse: collapse; margin: auto; }
    th, td { padding: 8px 12px; border: 1px solid #ccc; }
    footer { text-align: center; margin-top: 40px; }
    a { color: #0066cc; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Chaos Theory Image Feature Dashboard</h1>

  <div class="chart-container"><canvas id="pcaChart"></canvas></div>
  <div class="chart-container"><canvas id="classMeanChart"></canvas></div>
  <div class="chart-container"><canvas id="chaosChart"></canvas></div>

  <div class="chart-container">
    <h2>Feature Comparison</h2>
    <table>
      <thead>
        <tr>
          <th>Class</th><th>FracDim</th><th>Hurst</th><th>FracDim Patch Mean</th>
          <th>FracDim Patch SD</th><th>Entropy Mean Patch</th><th>Mean Mean Patch</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>NORMAL</td><td>1.8639</td><td>0.7295</td><td>1.4402</td><td>0.1240</td><td>11.118</td><td>0.00180</td></tr>
        <tr><td>PNEUMONIA</td><td>1.8493</td><td>0.7313</td><td>1.4242</td><td>0.1058</td><td>11.219</td><td>0.00183</td></tr>
      </tbody>
    </table>
  </div>

  <div class="chart-container"><canvas id="heatmapChart"></canvas></div>
  <div class="chart-container"><canvas id="scatterChart"></canvas></div>
  <div class="chart-container"><canvas id="pairwiseChart"></canvas></div>
  <div class="chart-container"><canvas id="entropyBoxplot"></canvas></div>

  <footer><p>Return to <a href="https://yourcarrdpage.carrd.co" target="_blank">Landing Page</a></p></footer>

  <script>
    // PCA
    new Chart(document.getElementById('pcaChart'), {
      type: 'bar',
      data: { labels: ['PC1','PC2','PC3','PC4','PC5','PC6'],
        datasets: [{ label: 'Explained Variance Ratio',
          data: [0.3336,0.2824,0.1866,0.0804,0.0669,0.0501],
          backgroundColor: 'rgba(75,192,192,0.6)' }] },
      options: { plugins: { title: { display: true, text: 'PCA Explained Variance Ratios' } } }
    });

    // Per-Class Mean
    new Chart(document.getElementById('classMeanChart'), {
      type: 'pie',
      data: { labels: ['NORMAL','PNEUMONIA'],
        datasets: [{ data: [0.45,0.62],
          backgroundColor: ['rgba(54,162,235,0.6)','rgba(255,99,132,0.6)'] }] },
      options: { plugins: { title: { display: true, text: 'Per-Class Mean Distribution' } } }
    });

    // Radar
    new Chart(document.getElementById('chaosChart'), {
      type: 'radar',
      data: { labels: ['FracDim','Hurst','FracDim_patch_mean','FracDim_patch_sd','Entropy_mean_patch','Mean_mean_patch'],
        datasets: [
          { label: 'NORMAL', data: [1.8639,0.7295,1.4402,0.1240,11.118,0.00180],
            backgroundColor:'rgba(54,162,235,0.2)', borderColor:'rgba(54,162,235,1)' },
          { label: 'PNEUMONIA', data: [1.8493,0.7313,1.4242,0.1058,11.219,0.00183],
            backgroundColor:'rgba(255,99,132,0.2)', borderColor:'rgba(255,99,132,1)' }
        ] },
      options: { plugins: { title: { display: true, text: 'Chaos & Statistical Features Comparison' } } }
    });

    // Heatmap
    const correlationPairs = [
      {x:'FracDim_patch_sd', y:'FracDim_patch_mean', v:0.6263},
      {x:'Mean_mean_patch', y:'Entropy_mean_patch', v:0.5808},
      {x:'Hurst', y:'FracDim', v:0.5642},
      {x:'Entropy_mean_patch', y:'FracDim', v:0.2775},
      {x:'Entropy_mean_patch', y:'Hurst', v:0.2713},
      {x:'Entropy_mean_patch', y:'FracDim_patch_sd', v:0.2220},
      {x:'Mean_mean_patch', y:'Hurst', v:0.1733},
      {x:'Mean_mean_patch', y:'FracDim', v:0.1064},
      {x:'FracDim_patch_mean', y:'Hurst', v:0.0763},
      {x:'FracDim_patch_sd', y:'Hurst', v:0.0693},
      {x:'FracDim_patch_mean', y:'FracDim', v:0.0690},
      {x:'Entropy_mean_patch', y:'FracDim_patch_mean', v:0.0468},
      {x:'Mean_mean_patch', y:'FracDim_patch_sd', v:0.0281},
      {x:'FracDim_patch_sd', y:'FracDim', v:0.0157},
      {x:'Mean_mean_patch', y:'FracDim_patch_mean', v:0.00017}
    ];
    new Chart(document.getElementById('heatmapChart'), {
      type: 'matrix',
      data: { datasets: [{
        label: 'Correlation Heatmap',
        data: correlationPairs.map(p=>({x:p.x,y:p.y,v:p.v})),
        backgroundColor(ctx){ const v=ctx.dataset.data[ctx.dataIndex].v; return `rgba(255,0,0,${Math.min(1,v*2)})`; },
        width: ({chart})=>chart.chartArea.width/6,
        height: ({chart})=>chart.chartArea.height/6
      }]},
      options: {
        plugins:{ title:{display:true,text:'Feature Correlation Heatmap'},
          tooltip:{callbacks:{label:ctx=>`Correlation: ${ctx.dataset.data[ctx.dataIndex].v.toFixed(3)}`}}},
        scales:{ x:{type:'category',labels:[...new Set(correlationPairs.map(p=>p.x))]},
                 y:{type:'category',labels:[...new Set(correlationPairs.map(p=>p.y))]} }
      }
    });

    // Scatter
    new Chart(document.getElementById('scatterChart'), {
      type: 'scatter',
      data: { datasets: [
        { label:'NORMAL', data:[{x:1.8639,y:0.7295}], backgroundColor:'rgba(54,162,235,0.8)' },
        { label:'PNEUMONIA', data:[{x:1.8493,y:0.7313}], backgroundColor:'rgba(255,99,132,0.8)' }
      ]},
      options: { plugins:{ title:{display:true,text:'Separability Scatter Plot (FracDim vs Hurst)'} },
        scales:{ x:{title:{display:true,text:'FracDim'}}, y:{title:{display:true,text:'Hurst'}} }
      }
    });

        // Pairwise Correlation
    const pairwiseLabels = [
      'FracDim_patch_mean vs FracDim_patch_sd',
      'Entropy_mean_patch vs Mean_mean_patch',
      'FracDim vs Hurst',
      'FracDim vs Entropy_mean_patch',
      'Hurst vs Entropy_mean_patch',
      'FracDim_patch_sd vs Entropy_mean_patch',
      'Hurst vs Mean_mean_patch',
      'FracDim vs Mean_mean_patch',
      'Hurst vs FracDim_patch_mean',
      'Hurst vs FracDim_patch_sd',
      'FracDim vs FracDim_patch_mean',
      'FracDim_patch_mean vs Entropy_mean_patch',
      'FracDim_patch_sd vs Mean_mean_patch',
      'FracDim vs FracDim_patch_sd',
      'FracDim_patch_mean vs Mean_mean_patch'
    ];

    const pairwiseValues = [
      0.6263, 0.5808, 0.5642, 0.2775, 0.2713, 0.2220,
      0.1733, 0.1064, 0.0763, 0.0693, 0.0690, 0.0468,
      0.0281, 0.0157, 0.00017
    ];

    new Chart(document.getElementById('pairwiseChart'), {
      type: 'bar',
      data: {
        labels: pairwiseLabels,
        datasets: [{
          label: 'Correlation Strength',
          data: pairwiseValues,
          backgroundColor: 'rgba(153,102,255,0.6)'
        }]
      },
      options: {
        indexAxis: 'y',
        plugins: { title: { display: true, text: 'Pairwise Feature Correlations' } },
        scales: { x: { min:0, max:1, title:{display:true,text:'Correlation'} } }
      }
    });

    // Entropy Boxplot (mocked ranges around mean values)
    new Chart(document.getElementById('entropyBoxplot'), {
      type: 'boxplot',
      data: {
        labels: ['NORMAL','PNEUMONIA'],
        datasets: [{
          label: 'Entropy Distribution',
          data: [
            {min:10.9, q1:11.0, median:11.12, q3:11.2, max:11.3},
            {min:11.0, q1:11.1, median:11.22, q3:11.3, max:11.4}
          ],
          backgroundColor: ['rgba(54,162,235,0.6)','rgba(255,99,132,0.6)']
        }]
      },
      options: {
        plugins: { title: { display: true, text: 'Entropy Boxplot (NORMAL vs PNEUMONIA)' } }
      }
    });
  </script>
</body>
</html>
