<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chaos Theory Feature Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Chart.js core -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-boxplot@4.2.0"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #222;
    }
    .chart-container {
      width: 85%;
      margin: 40px auto;
    }
    table {
      border-collapse: collapse;
      margin: auto;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #ccc;
    }
    footer {
      text-align: center;
      margin-top: 40px;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Chaos Theory Image Feature Dashboard</h1>

  <!-- PCA Explained Variance -->
  <div class="chart-container">
    <canvas id="pcaChart"></canvas>
  </div>

  <!-- Per-Class Mean -->
  <div class="chart-container">
    <canvas id="classMeanChart"></canvas>
  </div>

  <!-- Radar Chart -->
  <div class="chart-container">
    <canvas id="chaosChart"></canvas>
  </div>

  <!-- Feature Table -->
  <div class="chart-container">
    <h2>Feature Comparison</h2>
    <table>
      <thead>
        <tr>
          <th>Class</th>
          <th>FracDim</th>
          <th>Hurst</th>
          <th>FracDim Patch Mean</th>
          <th>FracDim Patch SD</th>
          <th>Entropy Mean Patch</th>
          <th>Mean Mean Patch</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>NORMAL</td>
          <td>1.8639</td>
          <td>0.7295</td>
          <td>1.4402</td>
          <td>0.1240</td>
          <td>11.118</td>
          <td>0.00180</td>
        </tr>
        <tr>
          <td>PNEUMONIA</td>
          <td>1.8493</td>
          <td>0.7313</td>
          <td>1.4242</td>
          <td>0.1058</td>
          <td>11.219</td>
          <td>0.00183</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Heatmap -->
  <div class="chart-container">
    <canvas id="heatmapChart"></canvas>
  </div>

  <!-- Scatter Plot -->
  <div class="chart-container">
    <canvas id="scatterChart"></canvas>
  </div>

  <!-- Pairwise Correlation -->
  <div class="chart-container">
    <canvas id="pairwiseChart"></canvas>
  </div>

  <!-- Entropy Boxplot -->
  <div class="chart-container">
    <canvas id="entropyBoxplot"></canvas>
  </div>

  <footer>
    <p>Return to <a href="https://yourcarrdpage.carrd.co" target="_blank">Landing Page</a></p>
  </footer>

          backgroundColor: 'rgba(75, 192, 192, 0.6)'
        }]
      },

        plugins: { title: { display: true, text: 'PCA Explained Variance Ratios' } }
